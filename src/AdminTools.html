<script>
function audienceValues(group){return Array.from(document.querySelectorAll('[data-audience="'+group+'"]:checked'),n=>n.value);}
function renderAudience(event={}){
  document.getElementById('eventAudience').innerHTML=[['statuses','Statuts',state.config?.statuses||['Sociétaire','Aspirant','Compagnon']],['cayennes','Cayennes',state.config?.cayennes||['Paris','Autre']]].map(([key,label,values])=>'<fieldset><legend>'+label+'</legend><div class="slot-choices">'+values.map(value=>'<label><input type="checkbox" data-audience="'+key+'" value="'+Ui.escape(value)+'" '+((event[key]||[]).includes(value)?'checked':'')+'>'+Ui.escape(value)+'</label>').join('')+'</div></fieldset>').join('');
}
function calendarEvent(id){return(state.dashboard?.calendar||state.dashboard?.events||[]).find(e=>e.id===id);}
function resetEventEdit(){
  state.editingEvent=null;document.getElementById('eventFormTitle').textContent='Un modèle, une date.';
  document.getElementById('cancelEventEdit').hidden=true;document.getElementById('templateSelect').disabled=false;
  document.getElementById('createEvent').textContent='Ajouter au calendrier';
  document.getElementById('eventForm').reset();applySelectedTemplate();renderAudience();
}
function editCalendarEvent(id){
  if(!state.token||state.eventBusy)return;const e=calendarEvent(id);if(!e)return;
  state.editingEvent=e;document.getElementById('eventFormTitle').textContent='Modifier le rendez-vous';
  document.getElementById('cancelEventEdit').hidden=false;document.getElementById('templateSelect').disabled=true;
  document.getElementById('createEvent').textContent='Enregistrer les modifications';
  const values={eventDate:e.date,eventTitle:e.title,eventType:e.type,eventCayenne:e.cayenne,eventStart:e.start,eventEnd:e.end,eventPlace:e.place,eventComment:e.comment,eventModalites:e.modalites||'Standard'};
  Object.entries(values).forEach(([key,value])=>document.getElementById(key).value=value||'');renderAudience(e);
  document.getElementById('eventForm').scrollIntoView({block:'start'});document.getElementById('eventTitle').focus();
}
function toggleCalendarEvent(id){
  if(!state.token||state.eventBusy)return;const e=calendarEvent(id);if(!e)return;
  if(!confirm((e.active===false?'Rétablir':'Annuler')+' « '+e.title+' » ? Les réponses déjà reçues seront conservées.'))return;
  const session=state.session;state.eventBusy=true;
  google.script.run.withSuccessHandler(result=>{if(session!==state.session)return;state.eventBusy=false;Ui.notice('adminNotice',result.message,'ok');loadDashboard();}).withFailureHandler(error=>{if(session!==state.session)return;state.eventBusy=false;Ui.notice('adminNotice',error.message||error);}).updateEvent({...e,active:e.active===false},pin());
}
function deleteCalendarEvent(id){
  if(!state.token||state.eventBusy)return;const e=calendarEvent(id);if(!e)return;
  if(!confirm('Supprimer définitivement « '+e.title+' » ? Cette action n’est possible que si aucune réponse n’a encore été enregistrée.'))return;
  const session=state.session;state.eventBusy=true;
  google.script.run.withSuccessHandler(result=>{if(session!==state.session)return;state.eventBusy=false;Ui.notice('adminNotice',result.message,'ok');resetEventEdit();loadDashboard();}).withFailureHandler(error=>{if(session!==state.session)return;state.eventBusy=false;Ui.notice('adminNotice',error.message||error);}).deleteEvent(id,pin());
}
function editMemberEmail(key){
  const member=state.accessMembers.find(m=>m.key===key);if(!member||state.accessBusy)return;
  state.emailMember=member;document.getElementById('memberEmailForm').hidden=false;
  document.getElementById('memberEmailTitle').textContent='Adresse de '+member.prenom+' '+member.nom;
  document.getElementById('memberEmailValue').value=member.email||'';document.getElementById('memberEmailValue').focus();
}
function closeMemberEmail(){state.emailMember=null;document.getElementById('memberEmailForm').reset();document.getElementById('memberEmailForm').hidden=true;document.getElementById('memberEmailTitle').textContent='Modifier l’email';Ui.loading('saveMemberEmail',false);}
function renderBackgroundStatus(data){
  document.getElementById('backgroundStatus').textContent=!data?'Connectez-vous pour consulter les traitements.':[
    data.ready?'Actualisation automatique active.':'Activation des traitements nécessaire par le propriétaire.',
    data.pending?data.pending+' mise(s) à jour en attente.':'Les mises à jour demandées sont terminées.',
    data.lastRun?'Dernier passage : '+new Date(data.lastRun).toLocaleString('fr-FR',{timeZone:'Europe/Paris'})+' (Paris).':'',data.error||''
  ].filter(Boolean).join(' ');
}
function loadMailLog(){
  if(!state.token)return;const session=state.session;Ui.loading('loadMailLog',true,'Chargement…');
  google.script.run.withSuccessHandler(rows=>{if(session!==state.session)return;state.mailRows=rows;Ui.loading('loadMailLog',false);renderMailLog();}).withFailureHandler(error=>{if(session!==state.session)return;Ui.loading('loadMailLog',false);Ui.notice('adminNotice',error.message||error);}).listMailDeliveries(pin());
}
function renderMailLog(){
  const q=Ui.normalize(document.getElementById('mailSearch').value);
  const labels={ENVOYE:'Remis à Google',ATTENTE:'En attente',SANS_EMAIL:'Adresse à corriger',EN_COURS:'En cours / à vérifier',A_VERIFIER:'À vérifier',ANNULE:'Annulé'};
  const rows=state.mailRows.filter(r=>Ui.normalize([r.name,r.title,r.email,labels[r.state]||r.state].join(' ')).includes(q));
  document.getElementById('mailDeliveries').innerHTML=rows.length?'<div class="member-table-wrap"><table class="member-table"><caption>Dernières notifications · un mail par événement et par membre</caption><thead><tr><th>Membre / événement</th><th>Type</th><th>État</th><th>Détail</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><strong>'+Ui.escape(r.name)+'</strong><br>'+Ui.escape(r.title)+'<br><small>'+Ui.escape(r.email)+'</small></td><td>'+Ui.escape(r.type==='RAPPEL'?'Rappel J−1':'Confirmation')+'</td><td>'+Ui.escape(labels[r.state]||r.state)+'</td><td>'+Ui.escape(r.detail)+(r.sentAt?'<br>'+Ui.escape(new Date(r.sentAt).toLocaleString('fr-FR',{timeZone:'Europe/Paris'})):'')+'</td></tr>').join('')+'</tbody></table></div>':Ui.empty('Aucune notification à afficher','Les nouvelles réponses apparaîtront après le prochain traitement automatique.','file');
}
function closeConfidential(){state.confidentialRequest++;document.getElementById('confidentialPanel').hidden=true;document.getElementById('confidentialDetails').textContent='';}
function loadConfidential(id){
  if(!state.token)return;const session=state.session,request=++state.confidentialRequest;
  document.getElementById('confidentialPanel').hidden=false;document.getElementById('confidentialDetails').textContent='Chargement…';
  google.script.run.withSuccessHandler(rows=>{if(session!==state.session||request!==state.confidentialRequest)return;
    document.getElementById('confidentialDetails').innerHTML=rows.length?rows.map(r=>'<article class="history-row"><div><strong>'+Ui.escape(r.name)+'</strong><p>'+Ui.escape([r.response,r.causes,r.precision].filter(Boolean).join(' · '))+'</p><p>'+Ui.escape(r.comment||'')+'</p></div></article>').join(''):Ui.empty('Aucun détail confidentiel','Les motifs et commentaires restent réservés au bureau.');
    document.getElementById('confidentialPanel').scrollIntoView({block:'start'});
  }).withFailureHandler(error=>{if(session!==state.session||request!==state.confidentialRequest)return;document.getElementById('confidentialDetails').textContent=error.message||error;}).getEventConfidentialDetails(id,pin());
}
function clearAuditPanels(){
  state.mailRows=[];state.eventBusy=false;closeMemberEmail();closeConfidential();renderBackgroundStatus(null);
  document.getElementById('mailDeliveries').textContent='';document.getElementById('mailSearch').value='';Ui.loading('loadMailLog',false);
  resetEventEdit();
}
document.getElementById('eventsRoot').addEventListener('click',event=>{
  const edit=event.target.closest('[data-edit-calendar]'),toggle=event.target.closest('[data-toggle-calendar]'),remove=event.target.closest('[data-delete-calendar]');
  if(edit)editCalendarEvent(edit.dataset.editCalendar);if(toggle)toggleCalendarEvent(toggle.dataset.toggleCalendar);if(remove)deleteCalendarEvent(remove.dataset.deleteCalendar);
});
document.getElementById('cancelEventEdit').addEventListener('click',()=>{if(!state.eventBusy)resetEventEdit();});
document.getElementById('memberAccessList').addEventListener('click',event=>{const button=event.target.closest('[data-email-member]');if(button)editMemberEmail(button.dataset.emailMember);});
document.getElementById('cancelMemberEmail').addEventListener('click',closeMemberEmail);
document.getElementById('memberEmailForm').addEventListener('submit',event=>{
  event.preventDefault();if(!state.emailMember||!state.token||document.getElementById('saveMemberEmail').disabled)return;
  const session=state.session,member=state.emailMember;Ui.loading('saveMemberEmail',true,'Enregistrement…');
  google.script.run.withSuccessHandler(result=>{if(session!==state.session)return;closeMemberEmail();Ui.notice('accessNotice',result.message,'ok');loadMemberAccess();}).withFailureHandler(error=>{if(session!==state.session)return;Ui.loading('saveMemberEmail',false);Ui.notice('accessNotice',error.message||error);}).updateMemberProfile({key:member.key,previousEmail:member.email||'',email:document.getElementById('memberEmailValue').value},pin());
});
document.getElementById('loadMailLog').addEventListener('click',loadMailLog);
document.getElementById('mailSearch').addEventListener('input',renderMailLog);
document.getElementById('reportsRoot').addEventListener('click',event=>{const button=event.target.closest('[data-confidential-event]');if(button)loadConfidential(button.dataset.confidentialEvent);});
document.getElementById('closeConfidential').addEventListener('click',closeConfidential);
</script>
