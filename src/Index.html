<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --wine: #7A1F2B;
      --wine-dark: #55131D;
      --ink: #1F2937;
      --muted: #6B7280;
      --line: #E5E7EB;
      --bg: #F8F6F4;
      --card: #FFFFFF;
      --soft: #F2E7E9;
      --green: #15803D;
      --amber: #B45309;
      --red: #B91C1C;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      background: var(--wine);
      color: white;
      padding: 18px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    header p {
      margin: 6px 0 0;
      color: #F9E8EC;
      font-size: 14px;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .tab.active {
      background: var(--wine);
      border-color: var(--wine);
      color: white;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    h3 {
      margin: 18px 0 10px;
      font-size: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 12px 0 5px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      padding: 10px 11px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      background: var(--wine);
      color: white;
      padding: 11px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #374151;
    }

    button.ghost {
      background: white;
      color: var(--wine);
      border: 1px solid var(--wine);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choices,
    .events {
      display: grid;
      gap: 8px;
    }

    .choice,
    .event {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid var(--line);
      background: #FFFFFF;
      border-radius: 8px;
      padding: 10px;
    }

    .choice input,
    .event input {
      width: auto;
      margin-top: 2px;
    }

    .event strong {
      display: block;
      margin-bottom: 2px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .notice {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #FFFFFF;
      font-size: 14px;
    }

    .notice.ok {
      border-color: #BBF7D0;
      background: #F0FDF4;
      color: var(--green);
    }

    .notice.error {
      border-color: #FECACA;
      background: #FEF2F2;
      color: var(--red);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .kpi {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .kpi span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .kpi strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--wine);
      color: white;
      font-size: 12px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .pill {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--soft);
      color: var(--wine-dark);
    }

    .pill.green {
      background: #DCFCE7;
      color: var(--green);
    }

    .pill.amber {
      background: #FEF3C7;
      color: var(--amber);
    }

    .pill.red {
      background: #FEE2E2;
      color: var(--red);
    }

    .toolbar {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar .field {
      width: 180px;
    }

    .admin-section {
      margin-top: 18px;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      background: white;
      border: 1px dashed #D1D5DB;
      border-radius: 8px;
    }

    @media (max-width: 860px) {
      .layout,
      .row,
      .kpis {
        grid-template-columns: 1fr;
      }

      main {
        padding: 12px;
      }

      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Présences et engagements</h1>
    <p>Cayenne de Paris - réponses anticipées, excuses et suivi annuel</p>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="public">Répondre</button>
      <button class="tab" data-tab="admin">Dashboard admin</button>
    </div>

    <section id="public" class="panel active">
      <form id="presenceForm" class="layout">
        <div class="card">
          <h2>Votre identité</h2>
          <div class="row">
            <div>
              <label for="nom">Nom</label>
              <input id="nom" name="nom" autocomplete="family-name" required>
            </div>
            <div>
              <label for="prenom">Prénom</label>
              <input id="prenom" name="prenom" autocomplete="given-name" required>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email">
            </div>
            <div>
              <label for="telephone">Téléphone</label>
              <input id="telephone" name="telephone" autocomplete="tel">
            </div>
          </div>

          <div class="row">
            <div>
              <label for="statut">Statut</label>
              <select id="statut" name="statut" required></select>
            </div>
            <div>
              <label for="cayenne">Cayenne</label>
              <select id="cayenne" name="cayenne" required></select>
            </div>
          </div>

          <label for="reponse">Je réponds pour les dates sélectionnées</label>
          <select id="reponse" name="reponse" required></select>

          <div id="absenceBlock">
            <h3>Cause d’absence</h3>
            <div id="causes" class="choices"></div>
            <label for="precision">Précision</label>
            <textarea id="precision" name="precision" placeholder="Exemple : travail UC ailleurs, réunion dans une autre Cayenne, service du soir..."></textarea>
          </div>

          <div id="aidBlock">
            <h3>Disponibilité pour aider</h3>
            <div class="row">
              <div>
                <label for="heureDebutAide">Début</label>
                <input id="heureDebutAide" name="heureDebutAide" type="time">
              </div>
              <div>
                <label for="heureFinAide">Fin</label>
                <input id="heureFinAide" name="heureFinAide" type="time">
              </div>
            </div>
          </div>

          <label for="commentaire">Commentaire</label>
          <textarea id="commentaire" name="commentaire"></textarea>
        </div>

        <div class="card">
          <h2>Événements de l’année</h2>
          <div class="actions">
            <button type="button" class="ghost" id="selectAll">Tout sélectionner</button>
            <button type="button" class="ghost" id="clearAll">Tout enlever</button>
          </div>
          <div id="events" class="events" style="margin-top: 12px;"></div>
          <div class="actions">
            <button id="submitBtn" type="submit">Enregistrer ma réponse</button>
          </div>
          <div id="publicNotice" class="notice" hidden></div>
        </div>
      </form>
    </section>

    <section id="admin" class="panel">
      <div class="card">
        <h2>Dashboard annuel</h2>
        <div class="toolbar">
          <div class="field">
            <label for="adminPin">Code admin</label>
            <input id="adminPin" type="password" inputmode="numeric">
          </div>
          <div class="field">
            <label for="adminYear">Année</label>
            <input id="adminYear" type="number" min="2020" max="2100">
          </div>
          <button id="loadDashboard" type="button">Charger</button>
          <button id="generateAll" class="secondary" type="button">Créer toutes les feuilles CR</button>
        </div>
        <div id="adminNotice" class="notice" hidden></div>
      </div>

      <div id="dashboardContent" class="admin-section"></div>
    </section>
  </main>

  <script>
    const state = {
      config: null,
      dashboard: null,
      loading: false
    };

    document.querySelectorAll('.tab').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((tab) => tab.classList.remove('active'));
        document.querySelectorAll('.panel').forEach((panel) => panel.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(button.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('reponse').addEventListener('change', updateConditionalBlocks);
    document.getElementById('selectAll').addEventListener('click', () => setAllEvents(true));
    document.getElementById('clearAll').addEventListener('click', () => setAllEvents(false));
    document.getElementById('presenceForm').addEventListener('submit', submitForm);
    document.getElementById('loadDashboard').addEventListener('click', loadDashboard);
    document.getElementById('generateAll').addEventListener('click', generateAllSheets);

    init();

    function init() {
      google.script.run
        .withSuccessHandler((config) => {
          state.config = config;
          fillSelect('statut', config.statuses);
          fillSelect('cayenne', config.cayennes);
          fillSelect('reponse', config.responseTypes);
          document.getElementById('adminYear').value = config.activeYear;
          renderCauses(config.causes);
          renderEvents(config.events);
          updateConditionalBlocks();
        })
        .withFailureHandler((error) => showNotice('publicNotice', error.message || error, 'error'))
        .getPublicConfig();
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Choisir</option>' + values.map((value) => {
        return `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`;
      }).join('');
    }

    function renderCauses(causes) {
      const container = document.getElementById('causes');
      container.innerHTML = causes.map((cause, index) => {
        return `
          <label class="choice" for="cause_${index}">
            <input id="cause_${index}" type="checkbox" name="causes" value="${escapeHtml(cause)}">
            <span>${escapeHtml(cause)}</span>
          </label>
        `;
      }).join('');
    }

    function renderEvents(events) {
      const container = document.getElementById('events');
      if (!events.length) {
        container.innerHTML = '<div class="empty">Aucun événement actif dans le calendrier.</div>';
        return;
      }
      container.innerHTML = events.map((event) => {
        return `
          <label class="event">
            <input type="checkbox" name="eventIds" value="${escapeHtml(event.id)}">
            <span>
              <strong>${escapeHtml(event.title)}</strong>
              <span class="meta">${escapeHtml(event.date)} - ${escapeHtml(event.type)} - ${escapeHtml(event.start || '')}${event.end ? ' à ' + escapeHtml(event.end) : ''}</span>
            </span>
          </label>
        `;
      }).join('');
    }

    function updateConditionalBlocks() {
      const value = document.getElementById('reponse').value;
      document.getElementById('absenceBlock').style.display = value === 'Absent excusé' ? 'block' : 'none';
      document.getElementById('aidBlock').style.display = value === 'Disponible pour aider' ? 'block' : 'none';
    }

    function setAllEvents(checked) {
      document.querySelectorAll('input[name="eventIds"]').forEach((input) => {
        input.checked = checked;
      });
    }

    function submitForm(event) {
      event.preventDefault();
      setLoading(true, 'submitBtn');
      const form = document.getElementById('presenceForm');
      const formData = new FormData(form);
      const eventIds = Array.from(document.querySelectorAll('input[name="eventIds"]:checked')).map((input) => input.value);
      const causes = Array.from(document.querySelectorAll('input[name="causes"]:checked')).map((input) => input.value);
      const payload = {
        nom: formData.get('nom'),
        prenom: formData.get('prenom'),
        email: formData.get('email'),
        telephone: formData.get('telephone'),
        statut: formData.get('statut'),
        cayenne: formData.get('cayenne'),
        reponse: formData.get('reponse'),
        causes,
        precision: formData.get('precision'),
        heureDebutAide: formData.get('heureDebutAide'),
        heureFinAide: formData.get('heureFinAide'),
        commentaire: formData.get('commentaire'),
        eventIds,
        source: eventIds.length > 1 ? 'Réponse anticipée' : 'Réponse événement'
      };

      google.script.run
        .withSuccessHandler((result) => {
          showNotice('publicNotice', result.message, 'ok');
          form.reset();
          updateConditionalBlocks();
          setLoading(false, 'submitBtn');
        })
        .withFailureHandler((error) => {
          showNotice('publicNotice', error.message || error, 'error');
          setLoading(false, 'submitBtn');
        })
        .submitResponses(payload);
    }

    function loadDashboard() {
      const pin = document.getElementById('adminPin').value;
      const year = Number(document.getElementById('adminYear').value);
      setLoading(true, 'loadDashboard');
      google.script.run
        .withSuccessHandler((dashboard) => {
          state.dashboard = dashboard;
          renderDashboard(dashboard);
          showNotice('adminNotice', 'Dashboard chargé.', 'ok');
          setLoading(false, 'loadDashboard');
        })
        .withFailureHandler((error) => {
          showNotice('adminNotice', error.message || error, 'error');
          setLoading(false, 'loadDashboard');
        })
        .getDashboardData(year, pin);
    }

    function generateAllSheets() {
      const pin = document.getElementById('adminPin').value;
      const year = Number(document.getElementById('adminYear').value);
      setLoading(true, 'generateAll');
      google.script.run
        .withSuccessHandler((results) => {
          showNotice('adminNotice', `${results.length} feuille(s) de compte rendu générée(s).`, 'ok');
          setLoading(false, 'generateAll');
          loadDashboard();
        })
        .withFailureHandler((error) => {
          showNotice('adminNotice', error.message || error, 'error');
          setLoading(false, 'generateAll');
        })
        .generateAllEventSheets(year, pin);
    }

    function generateOneSheet(eventId) {
      const pin = document.getElementById('adminPin').value;
      google.script.run
        .withSuccessHandler((result) => {
          showNotice('adminNotice', `Feuille créée : ${result.sheetName}`, 'ok');
          loadDashboard();
        })
        .withFailureHandler((error) => showNotice('adminNotice', error.message || error, 'error'))
        .generateEventSheet(eventId, pin);
    }

    function renderDashboard(data) {
      const root = document.getElementById('dashboardContent');
      root.innerHTML = `
        <div class="kpis">
          ${kpi('Événements', data.kpis.events)}
          ${kpi('Membres', data.kpis.members)}
          ${kpi('Présents', data.kpis.presents)}
          ${kpi('Excusés', data.kpis.excused)}
          ${kpi('Sans réponse', data.kpis.noResponse)}
          ${kpi('Aides', data.kpis.aids)}
        </div>

        <div class="card admin-section">
          <h2>Suivi par événement</h2>
          ${renderEventTable(data.events)}
        </div>

        <div class="card admin-section">
          <h2>Suivi par personne</h2>
          ${renderMemberTable(data.members)}
        </div>

        <div class="card admin-section">
          <h2>Causes d’absence</h2>
          ${renderCauseTable(data.causes)}
        </div>
      `;
    }

    function kpi(label, value) {
      return `<div class="kpi"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function renderEventTable(events) {
      if (!events.length) return '<div class="empty">Aucun événement actif.</div>';
      return `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Événement</th>
              <th>Présents</th>
              <th>Excusés</th>
              <th>Sans réponse</th>
              <th>Aides</th>
              <th>Feuille CR</th>
            </tr>
          </thead>
          <tbody>
            ${events.map((event) => `
              <tr>
                <td>${escapeHtml(event.date)}</td>
                <td><strong>${escapeHtml(event.title)}</strong><br><span class="meta">${escapeHtml(event.type)}</span></td>
                <td><span class="pill green">${escapeHtml(event.presents)}</span></td>
                <td><span class="pill amber">${escapeHtml(event.excused)}</span></td>
                <td><span class="pill red">${escapeHtml(event.noResponse)}</span></td>
                <td><span class="pill">${escapeHtml(event.aids)}</span></td>
                <td><button type="button" onclick="generateOneSheet('${escapeJs(event.id)}')">Créer / actualiser</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderMemberTable(members) {
      if (!members.length) return '<div class="empty">Aucun membre actif.</div>';
      return `
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Statut</th>
              <th>Cayenne</th>
              <th>Présences</th>
              <th>Excusés</th>
              <th>Sans réponse</th>
              <th>Aides</th>
              <th>Taux</th>
            </tr>
          </thead>
          <tbody>
            ${members.map((member) => `
              <tr>
                <td><strong>${escapeHtml(member.nom)} ${escapeHtml(member.prenom)}</strong></td>
                <td>${escapeHtml(member.statut)}</td>
                <td>${escapeHtml(member.cayenne)}</td>
                <td>${escapeHtml(member.presents)}</td>
                <td>${escapeHtml(member.excused)}</td>
                <td>${escapeHtml(member.noResponse)}</td>
                <td>${escapeHtml(member.aids)}</td>
                <td>${Math.round((member.presenceRate || 0) * 100)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderCauseTable(causes) {
      if (!causes.length) return '<div class="empty">Aucune absence excusée enregistrée.</div>';
      return `
        <table>
          <thead><tr><th>Cause</th><th>Total</th></tr></thead>
          <tbody>
            ${causes.map((cause) => `
              <tr><td>${escapeHtml(cause.cause)}</td><td>${escapeHtml(cause.count)}</td></tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function showNotice(id, message, type) {
      const node = document.getElementById(id);
      node.hidden = false;
      node.className = 'notice ' + type;
      node.textContent = message;
    }

    function setLoading(isLoading, buttonId) {
      const button = document.getElementById(buttonId);
      if (!button) return;
      button.disabled = isLoading;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeJs(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
