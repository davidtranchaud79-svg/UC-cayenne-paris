name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

env:
  CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
  CLASP_ACCESS_TOKEN: ${{ secrets.CLASP_ACCESS_TOKEN }}
  CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
  CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
  CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
  CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Check deployment secrets
        run: |
          missing=0
          for name in CLASP_SCRIPT_ID CLASP_ACCESS_TOKEN CLASP_REFRESH_TOKEN CLASP_CLIENT_ID CLASP_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Ajoutez les secrets GitHub dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Write clasp config
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "$CLASP_SCRIPT_ID",
            "rootDir": "src"
          }
          JSON

      - name: Write clasp credentials
        run: |
          cat > ~/.clasprc.json <<JSON
          {
            "token": {
              "access_token": "$CLASP_ACCESS_TOKEN",
              "refresh_token": "$CLASP_REFRESH_TOKEN",
              "scope": "https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/script.webapp.deploy https://www.googleapis.com/auth/drive.file",
              "token_type": "Bearer",
              "expiry_date": 0
            },
            "oauth2ClientSettings": {
              "clientId": "$CLASP_CLIENT_ID",
              "clientSecret": "$CLASP_CLIENT_SECRET",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": true
          }
          JSON

      - name: Push sources to Apps Script
        run: clasp push --force

      - name: Deploy existing Web App if configured
        run: |
          if [ -n "$CLASP_DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "GitHub $GITHUB_SHA"
          else
            echo "Code pushed to Apps Script. Add CLASP_DEPLOYMENT_ID secret to update the Web App automatically."
          fi
