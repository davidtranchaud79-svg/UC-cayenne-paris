name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

env:
  CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp config
        run: |
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "${{ secrets.CLASP_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON

      - name: Write clasp credentials
        run: |
          cat > ~/.clasprc.json <<'JSON'
          {
            "token": {
              "access_token": "${{ secrets.CLASP_ACCESS_TOKEN }}",
              "refresh_token": "${{ secrets.CLASP_REFRESH_TOKEN }}",
              "scope": "https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/script.webapp.deploy https://www.googleapis.com/auth/drive.file",
              "token_type": "Bearer",
              "expiry_date": 0
            },
            "oauth2ClientSettings": {
              "clientId": "${{ secrets.CLASP_CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLASP_CLIENT_SECRET }}",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": true
          }
          JSON

      - name: Push sources to Apps Script
        run: clasp push --force

      - name: Deploy existing Web App
        if: ${{ env.CLASP_DEPLOYMENT_ID != '' }}
        run: clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "GitHub $GITHUB_SHA"

      - name: Deployment note
        if: ${{ env.CLASP_DEPLOYMENT_ID == '' }}
        run: echo "Code pushed to Apps Script. Add CLASP_DEPLOYMENT_ID secret to update the Web App automatically."
