name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/deploy-apps-script.yml"
      - "scripts/deploy-apps-script.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
      # Public identifier from the application's shared URL; it is not a credential.
      CLASP_DEPLOYMENT_ID: AKfycbyV1W4Y_-xMyoz9w9YOKYhw6dN_UI9XIS34GblkIRuD5W8KhbnZzk2eg67oHTKvXLWLNQ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check deployment secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          missing=0
          for name in CLASP_SCRIPT_ID CLASPRC_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Ajoutez les secrets GitHub dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test interface and deployment verification
        run: npm test

      - name: Write clasp configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const fail = message => {
            console.error('::error::' + message);
            process.exit(1);
          };
          let credentials;
          try {
            credentials = JSON.parse(process.env.CLASPRC_JSON);
          } catch {
            fail('CLASPRC_JSON doit contenir le fichier JSON complet obtenu après clasp login.');
          }
          const token = credentials?.tokens?.default;
          if (token?.type !== 'authorized_user' ||
              ['client_id', 'client_secret', 'refresh_token'].some(key =>
                typeof token[key] !== 'string' || !token[key].trim())) {
            fail('Connexion Google incomplète. Relancez npx --yes @google/clasp@3.4.1 login et recopiez le fichier dans CLASPRC_JSON.');
          }
          const scriptId = process.env.CLASP_SCRIPT_ID.trim();
          if (!/^[A-Za-z0-9_-]+$/.test(scriptId)) {
            fail('CLASP_SCRIPT_ID doit contenir uniquement l’ID du script, sans URL.');
          }
          fs.writeFileSync('.clasp.json', JSON.stringify({scriptId, rootDir: 'src'}), {mode: 0o600});
          fs.writeFileSync(path.join(os.homedir(), '.clasprc.json'),
            JSON.stringify({tokens: {default: token}}), {mode: 0o600});
          NODE

      - name: Push sources to Apps Script
        run: clasp push --force

      - name: Update existing Web App
        run: node scripts/deploy-apps-script.mjs

      - name: Remove runner credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
