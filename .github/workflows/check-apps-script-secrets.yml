name: Vérifier les secrets Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-apps-script-secrets.yml'
      - 'scripts/check-apps-script-connection.mjs'
      - 'scripts/check-apps-script-connection.test.mjs'
      - 'scripts/inspect-web-app.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tester le diagnostic et la protection des secrets
        run: node --test scripts/check-apps-script-connection.test.mjs
      - name: Installer clasp
        run: npm install -g @google/clasp@3.4.1
      - name: Vérifier les secrets et le projet Google
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: node scripts/check-apps-script-connection.mjs
      - name: Inspecter les droits et l’accès public sans modifier le déploiement
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/inspect-web-app.mjs
      - name: Effacer les identifiants du runner
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
